services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gryzun
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console

  api:
    build:
      context: ./Grader
      dockerfile: Dockerfile
    depends_on:
      - db
      - minio
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: gryzun
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
      # Task/submission files live in MinIO (see db.py), not on disk -- the
      # root user/password below double as its access/secret key.
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-gryzun}
      MINIO_SECURE: "false"
      SCRATCH_ROOT: /scratch
      # Real host path of ./scratch -- required so the host Docker daemon can
      # bind-mount the per-submission files sandbox.py downloads from MinIO
      # into sandbox containers. Set this explicitly in .env; ${PWD} only
      # resolves correctly if you run `docker compose` from this directory.
      HOST_SCRATCH_ROOT: ${HOST_SCRATCH_ROOT:-${PWD}/scratch}
      SANDBOX_IMAGE: gryzun-sandbox:latest
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-10}
      SANDBOX_MEM_LIMIT: ${SANDBOX_MEM_LIMIT:-256m}
      SANDBOX_PIDS_LIMIT: ${SANDBOX_PIDS_LIMIT:-64}
      # No local `ollama` service -- point this at whatever Ollama instance
      # you're running (local or remote) via .env.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
    volumes:
      - ./scratch:/scratch
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"

  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    depends_on:
      - db
      - minio
      - api
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: gryzun
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-gryzun}
      MINIO_SECURE: "false"
      # Talks to the `api` service over the compose network, not localhost --
      # this container has no Docker socket / Ollama access of its own.
      API_BASE_URL: http://api:8000
      NICEGUI_STORAGE_SECRET: ${WEBAPP_STORAGE_SECRET:?set WEBAPP_STORAGE_SECRET in .env}
      # Where JupyterHub's per-user Docker volumes live on the host -- see
      # webapp/data.py's copy_task_to_jupyter(). Mounted at the *same* path
      # inside the container as on the host so no path translation is
      # needed. Optional JUPYTER_CHOWN_UID/GID (also set in .env) let you
      # hand copied files to the UID Jupyter's own container runs as, if it
      # can't otherwise read root-owned files.
      JUPYTER_VOLUMES_ROOT: ${JUPYTER_VOLUMES_ROOT:-/data/docker-data/volumes}
      JUPYTER_CHOWN_UID: ${JUPYTER_CHOWN_UID:-}
      JUPYTER_CHOWN_GID: ${JUPYTER_CHOWN_GID:-}
    volumes:
      # Read-write, and deliberately broad (the whole volumes directory, not
      # one user's) since JupyterHub creates a new per-user volume the first
      # time each student logs in -- there's no way to mount only "future
      # student folders" in advance. This gives the webapp container write
      # access to every JupyterHub user's files, not just the ones it copies
      # task materials into. Adjust JUPYTER_VOLUMES_ROOT in .env first if
      # your JupyterHub uses a different Docker data-root.
      - ${JUPYTER_VOLUMES_ROOT:-/data/docker-data/volumes}:${JUPYTER_VOLUMES_ROOT:-/data/docker-data/volumes}
    ports:
      - "8080:8080"

volumes:
  pgdata:
  minio_data:
